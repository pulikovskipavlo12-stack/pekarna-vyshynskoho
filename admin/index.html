<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адмінка — Пекарня Вишинського</title><style>body{font-family:Arial;background:#f7efe4;color:#3b2415;margin:0}.wrap{max-width:900px;margin:auto;padding:25px}.card{background:white;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 3px 15px #0001}input,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #d9c6b0;border-radius:9px}button{padding:10px 15px;border:0;border-radius:9px;background:#7b421d;color:white;font-weight:bold;cursor:pointer}.item{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:10px}.danger{background:#a22}</style></head><body><div class="wrap"><h1>🥖 Адмінка</h1><p>Пекарня Вишинського</p><div class="card"><h2>Додати товар</h2><input id="name" placeholder="Назва"><input id="price" type="number" placeholder="Ціна, грн"><input id="image" placeholder="Посилання на фото"><textarea id="description" placeholder="Опис / склад"></textarea><button onclick="add()">Додати товар</button></div><div class="card"><h2>Товари</h2><div id="list">Завантаження...</div></div></div><script>async function load(){const r=await fetch('/api/products');if(!r.ok){list.textContent='Не вдалося завантажити';return}const a=await r.json();list.innerHTML=a.length?a.map(x=>`<div class=item><div><b>${x.name}</b><br>${x.price} грн<br>${x.description||''}</div><button class=danger onclick="del('${x.id}')">Видалити</button></div>`).join(''):'Товарів ще немає.'}async function add(){await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,price:price.value,image:image.value,description:description.value})});name.value=price.value=image.value=description.value='';load()}async function del(id){if(confirm('Видалити товар?')){await fetch('/api/products/'+id,{method:'DELETE'});load()}}load()</script></body></html>
