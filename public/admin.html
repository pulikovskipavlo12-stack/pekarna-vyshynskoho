<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адмін — Пекарня Вишинського</title>
<style>body{font-family:Arial;background:#fbf5ea;color:#3b2415;margin:0}.wrap{max-width:1000px;margin:auto;padding:25px}.box{background:#fff;padding:25px;border-radius:18px;margin:18px 0}input,textarea{width:100%;padding:11px;margin:6px 0 12px;box-sizing:border-box;border:1px solid #ddcdbb;border-radius:9px}button{background:#5b321c;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}.danger{background:#a33}.prod{border-top:1px solid #eadbca;padding:14px 0}</style>
<div class="wrap"><h1>🥐 Адмін-панель</h1><div id="login" class="box"><h2>Вхід</h2><input id="pw" type="password" placeholder="Пароль"><button onclick="login()">Увійти</button></div><div id="panel" style="display:none"><div class="box"><h2>Додати товар</h2><input id="n" placeholder="Назва"><input id="p" type="number" placeholder="Ціна"><input id="im" placeholder="URL фото"><textarea id="d" placeholder="Опис"></textarea><button onclick="add()">Додати</button></div><div class="box"><h2>Товари</h2><div id="ps"></div></div><div class="box"><h2>Замовлення</h2><div id="os"></div></div></div></div>
<script>let pass="";async function login(){{pass=pw.value;let r=await fetch("/api/admin/login",{{method:"POST",headers:{{"Content-Type":"application/json"}},body:JSON.stringify({{password:pass}})}});if(r.ok){{loginBox=document.getElementById("login");loginBox.style.display="none";panel.style.display="block";load()}}else alert("Невірний пароль")}}
async function load(){{let h={{"x-admin-password":pass}},p=await fetch("/api/admin/products",{{headers:h}}).then(r=>r.json());ps.innerHTML=p.map(x=>`<div class="prod"><b>${{x.name}}</b> — ${{x.price}} грн <button onclick="edit(${{x.id}},'${{x.name.replaceAll("'","\\'")}}',${{x.price}})">Редагувати</button> <button class="danger" onclick="delp(${{x.id}})">Видалити</button></div>`).join("");let o=await fetch("/api/admin/orders",{{headers:h}}).then(r=>r.json());os.innerHTML=o.length?o.map(x=>`<div class="prod"><b>${{x.name}}</b> — ${{x.phone}} — ${{x.total}} грн<br>${{x.items.map(i=>i.name+" × "+i.qty).join(", ")}}<br>Статус: ${{x.status}} <button onclick="stat('${{x.id}}','done')">Виконано</button></div>`).join(""):"Замовлень немає"}}
async function add(){{await fetch("/api/admin/products",{{method:"POST",headers:{{"Content-Type":"application/json","x-admin-password":pass}},body:JSON.stringify({{name:n.value,price:p.value,image:im.value,description:d.value}})}});load()}}
async function delp(id){{if(confirm("Видалити?")){{await fetch("/api/admin/products/"+id,{{method:"DELETE",headers:{{"x-admin-password":pass}}}});load()}}}}
async function edit(id,name,price){{let n=prompt("Назва",name),p=prompt("Ціна",price);if(n!==null&&p!==null){{await fetch("/api/admin/products/"+id,{{method:"PUT",headers:{{"Content-Type":"application/json","x-admin-password":pass}},body:JSON.stringify({{name:n,price:p}})}});load()}}}}
async function stat(id,status){{await fetch("/api/admin/orders/"+id,{{method:"PATCH",headers:{{"Content-Type":"application/json","x-admin-password":pass}},body:JSON.stringify({{status}})}});load()}}</script>
