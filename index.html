<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Адмінка — Пекарня Вишинського</title>
<style>
body{font-family:Arial;background:#f7efe4;color:#3b2415;margin:0}
.wrap{max-width:900px;margin:auto;padding:25px}
.card{background:white;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 3px 15px #0001}
input,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #d9c6b0;border-radius:9px}
button{padding:10px 15px;border:0;border-radius:9px;background:#7b421d;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.item{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:10px}
.danger{background:#a22}
#msg{margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<h1>🥖 Адмінка</h1>
<p>Пекарня Вишинського</p>

<div class="card">
<h2>Додати товар</h2>
<input id="productName" placeholder="Назва">
<input id="productPrice" type="number" placeholder="Ціна, грн">
<input id="productImage" placeholder="Посилання на фото">
<textarea id="productDescription" placeholder="Опис / склад"></textarea>
<button id="addButton" type="button">Додати товар</button>
<div id="msg"></div>
</div>

<div class="card">
<h2>Товари</h2>
<div id="list">Завантаження...</div>
</div>
</div>

<script>
const productName = document.getElementById('productName');
const productPrice = document.getElementById('productPrice');
const productImage = document.getElementById('productImage');
const productDescription = document.getElementById('productDescription');
const addButton = document.getElementById('addButton');
const list = document.getElementById('list');
const msg = document.getElementById('msg');

async function load() {
  try {
    const r = await fetch('/api/products');
    if (!r.ok) throw new Error('Не вдалося завантажити товари');
    const a = await r.json();
    list.innerHTML = a.length
      ? a.map(x => `<div class="item"><div><b>${escapeHtml(x.name)}</b><br>${x.price} грн<br>${escapeHtml(x.description || '')}</div><button class="danger" type="button" onclick="del('${x.id}')">Видалити</button></div>`).join('')
      : 'Товарів ще немає.';
  } catch (e) {
    list.textContent = e.message;
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

addButton.addEventListener('click', async () => {
  const name = productName.value.trim();
  const price = productPrice.value.trim();

  if (!name) {
    msg.textContent = 'Введи назву товару.';
    productName.focus();
    return;
  }

  addButton.disabled = true;
  msg.textContent = 'Збереження...';

  try {
    const r = await fetch('/api/products', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        name,
        price,
        image:productImage.value.trim(),
        description:productDescription.value.trim()
      })
    });

    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || 'Не вдалося додати товар');
    }

    productName.value = '';
    productPrice.value = '';
    productImage.value = '';
    productDescription.value = '';
    msg.textContent = 'Товар додано ✓';
    await load();
  } catch (e) {
    msg.textContent = e.message;
  } finally {
    addButton.disabled = false;
  }
});

async function del(id) {
  if (!confirm('Видалити товар?')) return;
  await fetch('/api/products/' + encodeURIComponent(id), {method:'DELETE'});
  await load();
}

load();
</script>
</body>
</html>
