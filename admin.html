<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адмін — Пекарня Вишинського</title><style>body{margin:0;background:#111;color:#eee;font-family:Arial;padding:25px}main{max-width:1100px;margin:auto}.box{background:#1b1917;border:1px solid #3b332b;border-radius:15px;padding:20px;margin:15px 0}input,select{padding:10px;background:#25211d;color:#fff;border:1px solid #4a4036;border-radius:7px;margin:4px}button{padding:10px 14px;border:0;border-radius:7px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #38312b;text-align:left}h1{color:#d6a75c}.danger{background:#8b3c32;color:#fff}</style></head><body><main><h1>Адмін-панель</h1><div id="login" class="box"><h3>Вхід</h3><input id="pass" type="password" placeholder="Пароль"><button onclick="login()">Увійти</button><p id="err"></p></div><div id="app" style="display:none"><div class="box"><h2>Товари</h2><input id="name" placeholder="Назва"><input id="price" type="number" placeholder="Ціна"><input id="cat" placeholder="Категорія"><input id="image" placeholder="URL фото"><button onclick="add()">Додати товар</button><div id="products"></div></div><div class="box"><h2>Замовлення</h2><div id="orders"></div></div></div></main><script>let token=localStorage.getItem('adminToken')||'';async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pass.value})}),j=await r.json();if(r.ok){token=j.token;localStorage.setItem('adminToken',token);show()}else err.textContent=j.error}async function show(){loginBox.style.display='none';app.style.display='block';loadProducts();loadOrders()}let loginBox=document.getElementById('login');async function api(url,opt={}){opt.headers={...(opt.headers||{}),authorization:'Bearer '+token,'content-type':'application/json'};let r=await fetch(url,opt);if(r.status===401){localStorage.removeItem('adminToken');location.reload()}return r.json()}async function loadProducts(){let p=await fetch('/api/products').then(r=>r.json());products.innerHTML='<table><tr><th>Назва</th><th>Ціна</th><th>Категорія</th><th></th></tr>'+p.map(x=>`<tr><td><input value="${x.name}" id="n${x.id}"></td><td><input type="number" value="${x.price}" id="p${x.id}"></td><td><input value="${x.category}" id="c${x.id}"></td><td><button onclick="edit('${x.id}')">Зберегти</button> <button class="danger" onclick="del('${x.id}')">Видалити</button></td></tr>`).join('')+'</table>'}async function add(){await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:name.value,price:price.value,category:cat.value,image:image.value})});name.value=price.value=cat.value=image.value='';loadProducts()}async function edit(id){await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({name:document.getElementById('n'+id).value,price:document.getElementById('p'+id).value,category:document.getElementById('c'+id).value})});loadProducts()}async function del(id){if(confirm('Видалити товар?')){await api('/api/admin/products/'+id,{method:'DELETE'});loadProducts()}}async function loadOrders(){let o=await api('/api/admin/orders');orders.innerHTML=o.length?o.map(x=>`<div class="box"><b>${x.name}</b> — ${x.phone}<br>${x.delivery} ${x.address}<br>${x.items.map(i=>i.name+' × '+i.qty).join(', ')}<br><strong>${x.total} грн</strong><br><select onchange="status('${x.id}',this.value)"><option ${x.status==='Нове'?'selected':''}>Нове</option><option ${x.status==='В роботі'?'selected':''}>В роботі</option><option ${x.status==='Готово'?'selected':''}>Готово</option><option ${x.status==='Виконано'?'selected':''}>Виконано</option></select></div>`).join(''):'Замовлень немає.'}async function status(id,s){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:s})});loadOrders()}if(token)show();</script></body></html>
